name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Repository Source
        run: |
          # Baixa o código do repositório atual em formato ZIP direto da API do GitHub e descompacta
          curl -L -o repo.zip "https://api.github.com/repos/${{ github.repository }}/zipball/${{ github.ref_name }}"
          mkdir -p project_source
          unzip -q repo.zip -d project_source
          # Move o conteúdo da pasta extraída (que tem um hash aleatório) para a raiz do workspace
          cd project_source/*
          shopt -s dotglob
          mv * ../../
          cd ../../
          rm -rf repo.zip project_source

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Clone Flutter SDK
        run: |
          rm -rf _flutter
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter
          echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH

      - name: Run Flutter Doctor
        run: flutter doctor

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk